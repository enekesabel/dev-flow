name: Skills validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install skills-ref==0.1.1
      - run: |
          status=0
          for skill in skills/*/; do agentskills validate "$skill" || status=1; done
          exit $status
